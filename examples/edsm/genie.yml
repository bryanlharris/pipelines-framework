              id: 01f1dd6ada4913c6a021fe5e59fa937f
              sql:
              - __END_AT IS NULL
            - display_name: Occupied (controlled) systems (${resources.catalogs.edsm.name}.silver.powerplay_history)
              id: 01f1dd6ada491cf59aa1a3582a5f1eb0
              sql:
              - powerState IN ('Exploited','Fortified','Stronghold')
          text_instructions:
          - content:
            - |
              This agent answers questions about the EDSM (Elite Dangerous Star Map) catalog.
            - |2+

            - |
              Data coverage:
            - |
              - The systems-with-coordinates and bodies tables are 7-day rolling windows: they hold only systems and bodies updated in EDSM during the latest weekly snapshot (Nov 1-7, 2026), not the full galaxy catalog.
            - |
              - Never conclude a system "does not exist" because it is missing from those tables; it likely just was not updated in the window (Sol itself is absent, for example). For systems not found there, check the systems-without-coordinates table, which is the full historical set.
            - |
              - For "how many systems exist in the galaxy" style questions, explain the 7-day window limitation rather than reporting a count.
            - |
              - Powerplay history is a full accumulating history; use the "Current powerplay state" filter to get the present state of a system.
            - |2+

            - |
              Powerplay:
            - |
              - A system can be occupied by multiple powers at once (for example, Exploited by several powers). When counting systems per power, count distinct systems.
            - |
              - "Controlled" or "occupied" means any non-Unoccupied powerplay state; use the "Occupied (controlled) systems" filter.
            - |
              - For power rankings and shares, prefer the gold power scoreboard tables. share_pct is a whole-number percentage (13.4 means 13.4%).
            - |
              - The scoreboard's bodies, landable, terraformable, and earth_like columns are sparsely populated and should not be treated as complete.
            - |2+

            - |
              Coordinates and distance:
            - |
              - System coordinates are galactic x, y, and z positions in light-years, with Sol at the origin. Use the "Distance from Sol in light-years" derived column for distance-from-Sol questions; "within N light-years of Sol" means that value is at most N.
            - |
              - To measure the distance between two systems, use the straight-line distance between their coordinates, in light-years.
            - |2+

            - |
              Body units:
            - |
              - distanceToArrival is in light-seconds from the system's arrival point; gravity in Earth gravities; radius in kilometers; surfaceTemperature in Kelvin; earthMasses in Earth masses.
            - |
              - Fuel-scoopable star flags are not available in these tables.
            - |2+

            - |
              General:
            - |
              - Use the gold tables for powerplay aggregates and the silver tables for system and body detail.
            - '- Match system names case-insensitively; if a system is missing from the coordinates table, fall back to the systems-without-coordinates table.'
            id: 01f1dd6aeaa912af8716fff27dc57975
        version: 2
