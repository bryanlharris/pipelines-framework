            question:
            - 'Closest systems to Sol — question: Which recently updated star systems are closest to Sol?'
            sql:
            - SELECT name, SQRT(POWER(coords.x,2) + POWER(coords.y,2) + POWER(coords.z,2)) AS distance_from_sol_ly FROM ${resources.catalogs.edsm.name}.silver.systemswithcoordinates7days ORDER BY distance_from_sol_ly ASC LIMIT 10
          - id: 01f1dd6adf001c53af5fbdc650f9737d
            question:
            - 'Landable planets nearest to Sol (join + distance) — question: Which landable planets are in the systems closest to Sol?'
            sql:
            - SELECT b.name AS body_name, b.systemName, b.subType, b.isLandable, b.gravity, ROUND(SQRT(POWER(s.coords.x,2) + POWER(s.coords.y,2) + POWER(s.coords.z,2)), 1) AS distance_from_sol_ly FROM ${resources.catalogs.edsm.name}.silver.bodies7days b JOIN ${resources.catalogs.edsm.name}.silver.systemswithcoordinates7days s ON b.systemId = s.id WHERE b.isLandable = true AND s.coords.x IS NOT NULL ORDER BY distance_from_sol_ly ASC LIMIT 25
          - id: 01f1dd6adf0115978e7db7105987dc4f
            question:
            - 'Controlled systems per power — question: How many systems does each power currently control? (reconciles with gold.power_scoreboard)'
            sql:
            - SELECT power, COUNT(DISTINCT name) AS controlled_systems FROM ${resources.catalogs.edsm.name}.silver.powerplay_history WHERE __END_AT IS NULL AND powerState IN ('Exploited','Fortified','Stronghold') GROUP BY power ORDER BY controlled_systems DESC
