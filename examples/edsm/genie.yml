# edsm's Genie agent: questions in plain English about silver and gold.
# Built in the GUI, then copied with:
#   databricks bundle generate genie-space --existing-id YOUR_SPACE_ID --key edsm_genie
# The definition is YAML, not the generated .geniespace.json, because
# variables only work in YAML: each table names the target's catalog.
resources:
  genie_spaces:
    edsm_genie:
      title: ${var.catalog_prefix}edsm - genie
      description: Answers questions about the EDSM catalog — star systems, celestial bodies, and related catalog data. Supports detailed lookups (e.g., "what's in the Sol system"), spatial queries (e.g., "systems within 50 light-years of Sol"), and aggregates/rankings across catalogued systems.
      warehouse_id: ${var.warehouse_id}
      parent_path: /Workspace/Users/${workspace.current_user.userName}
      serialized_space:
        benchmarks:
          questions:
          - answer:
            - content:
              - SELECT name, power, powerState FROM ${resources.catalogs.edsm.name}.silver.powerplay_history WHERE __END_AT IS NULL AND name = 'Chi Herculis'
              format: SQL
            id: 01f1dd6b0fb11847bff2e98f8ceffe5d
            question:
            - What is the current powerplay state of Chi Herculis?
          - answer:
            - content:
              - SELECT name, SQRT(POWER(coords.x,2) + POWER(coords.y,2) + POWER(coords.z,2)) AS distance_from_sol_ly FROM ${resources.catalogs.edsm.name}.silver.systemswithcoordinates7days ORDER BY distance_from_sol_ly ASC LIMIT 10
              format: SQL
            id: 01f1dd6b0fa01747bc9aa86357f9deb2
            question:
            - Which 10 recently updated star systems are closest to Sol?
          - answer:
            - content:
              - SELECT rank, power, controlled, share_pct FROM ${resources.catalogs.edsm.name}.gold.power_scoreboard ORDER BY rank
              format: SQL
            id: 01f1dd6afa20182c978df6df0dc7ee53
            question:
            - Which powers control the most systems, and what share of occupied systems does each hold?
        config:
