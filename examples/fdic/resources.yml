# fdic: FDIC quarterly financials for every insured bank (api.fdic.gov).
#
# The whole dataset: catalog, schemas, volumes, jobs and pipeline.
# Per table, only the router's --names list below changes.

# Enterprise catalogs live in each target's bucket, under catalogs/.
# Free has no bucket; its catalogs use default storage.
targets:
  dev:
    resources:
      catalogs:
        fdic:
          storage_root: s3://${var.catalog_bucket}/catalogs/${var.catalog_prefix}fdic/
  staging:
    resources:
      catalogs:
        fdic:
          storage_root: s3://${var.catalog_bucket}/catalogs/${var.catalog_prefix}fdic/
  prod:
    resources:
      catalogs:
        fdic:
          storage_root: s3://${var.catalog_bucket}/catalogs/${var.catalog_prefix}fdic/

resources:
  catalogs:
    # On free, the catalog is made by SQL first, then bound. On enterprise,
    # the bundle creates it. See doc/procedures/build_many_table_dataset/add_dataset.md.
    fdic:
      name: ${var.catalog_prefix}fdic
      comment: |-
        FDIC quarterly financials for every FDIC-insured bank: assets, deposits, equity, net income, ROA and ROE.

        Banks file a Call Report each quarter, and the FDIC publishes it through its public API.

        Good for comparing banks and tracking the banking system's health over time.

        - **Owner:** Bryan Harris
        - **About:** https://api.fdic.gov/banks/docs/
        - **Format:** CSV, one file per quarter of the current year
        - **Arrives:** quarterly, about two months after quarter end, by the fetch job or the upload script
      # The workspace sets this itself; listing it keeps the plan clean.
      properties:
        collation: UTF8_BINARY
      # Deploys reset these. The steward grants on schemas and tables
      # instead, in the GUI or Ontos.
      grants:
        - principal: ${var.run_as}
          privileges: [ALL_PRIVILEGES]
        - principal: ${workspace.current_user.userName}
          privileges: [MANAGE, USE_SCHEMA, SELECT, READ_VOLUME]
        - principal: ${var.team_group}
          privileges: [USE_SCHEMA, SELECT, READ_VOLUME]
        - principal: account users
          privileges: [USE_CATALOG]

  schemas:
    fdic_raw:
      catalog_name: ${resources.catalogs.fdic.name}
      name: raw
      comment: Files as they arrive. inbox is the drop zone. files is the permanent record.
    fdic_bronze:
      catalog_name: ${resources.catalogs.fdic.name}
      name: bronze
      comment: One table per file type. Every record from every file, as strings.
    fdic_silver:
      catalog_name: ${resources.catalogs.fdic.name}
      name: silver
      comment: Typed tables, plus views of the current records.
    fdic_sdp_meta:
      catalog_name: ${resources.catalogs.fdic.name}
      name: sdp_meta
      comment: The settings tables, and the copy of conf/ they are made from.

  volumes:
    fdic_raw_inbox:
      catalog_name: ${resources.catalogs.fdic.name}
      schema_name: ${resources.schemas.fdic_raw.name}
      name: inbox
      volume_type: MANAGED
      comment: Drop zone. The router moves each file to files, or to inbox/unknown_files. Deletes are fine here.
    fdic_raw_files:
      catalog_name: ${resources.catalogs.fdic.name}
      schema_name: ${resources.schemas.fdic_raw.name}
      name: files
      volume_type: MANAGED
      comment: Permanent record. Only the router writes here. Nothing is ever deleted. Full rebuilds read from here.
    fdic_sdp_meta_conf:
      catalog_name: ${resources.catalogs.fdic.name}
      schema_name: ${resources.schemas.fdic_sdp_meta.name}
      name: conf
      volume_type: MANAGED
      comment: Copy of fdic/conf, made when you apply settings. Serverless can't read workspace files.

  jobs:
    fdic_ingest:
      name: ${var.catalog_prefix}fdic - ingest
      tags:
        dataset: fdic
        role: ingest
        owner: Bryan Harris
      description: Moves new files from inbox to files.
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${resources.catalogs.fdic.name}/raw/inbox/
      tasks:
        - task_key: router
          # Fail once, no retries.
          disable_auto_optimization: true
          environment_key: default
          spark_python_task:
            python_file: ../../shared/file_router.py
            parameters:
              - --catalog
              - ${resources.catalogs.fdic.name}
              - --names
              # One line per table. The router sends each file to the
              # table its name starts with. Copy for each table.
              # - YOUR_TABLE
              - financials
              - institutions
        # Skip the pipeline when the router moved nothing (e.g. only an unknown file).
        - task_key: any_moved
          depends_on:
            - task_key: router
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.router.values.moved}}"
            right: "0"
        - task_key: pipeline
          # No disable_auto_optimization: pipeline tasks drop it, so the plan never settles.
          depends_on:
            - task_key: any_moved
              outcome: "true"
          pipeline_task:
            pipeline_id: ${resources.pipelines.fdic_pipeline.id}
      environments:
        - environment_key: default
          spec:
            environment_version: "6"

    fdic_apply_settings:
      name: ${var.catalog_prefix}fdic - apply settings
      tags:
        dataset: fdic
        role: apply_settings
        owner: Bryan Harris
      description: Copies fdic/conf to a volume, then writes sdp-meta's settings tables. Run after each change to conf/.
      tasks:
        - task_key: stage_conf
          # Fail once, no retries.
          disable_auto_optimization: true
          environment_key: sdp_meta
          python_wheel_task:
            package_name: databricks_labs_sdp_meta
            entry_point: stage_conf
            named_parameters:
              source_conf_dir: ${workspace.file_path}/datasets/fdic/conf
              uc_catalog: ${resources.catalogs.fdic.name}
              uc_schema: ${resources.schemas.fdic_sdp_meta.name}
              conf_volume: ${resources.volumes.fdic_sdp_meta_conf.name}
        # Points the source paths at the files catalog: staging reads prod's.
        - task_key: point_files
          # Fail once, no retries.
          disable_auto_optimization: true
          depends_on:
            - task_key: stage_conf
          environment_key: sdp_meta
          spark_python_task:
            python_file: ../../shared/point_files.py
            parameters:
              - --onboarding_file
              - /Volumes/${resources.catalogs.fdic.name}/sdp_meta/conf/conf/onboarding.yml
              - --files_catalog
              - ${var.files_prefix}fdic
        - task_key: apply
          # Fail once, no retries.
          disable_auto_optimization: true
          depends_on:
            - task_key: point_files
          environment_key: sdp_meta
          python_wheel_task:
            package_name: databricks_labs_sdp_meta
            entry_point: run
            named_parameters:
              onboard_layer: bronze_silver
              database: ${resources.catalogs.fdic.name}.${resources.schemas.fdic_sdp_meta.name}
              onboarding_file_path: /Volumes/${resources.catalogs.fdic.name}/sdp_meta/conf/conf/onboarding.yml
              bronze_dataflowspec_table: bronze_dataflowspec
              silver_dataflowspec_table: silver_dataflowspec
              uc_enabled: "True"
              import_author: ${workspace.current_user.userName}
              version: v1
              overwrite: "True"
              # Every target reads the same _all keys in onboarding.yml.
              env: all
      environments:
        - environment_key: sdp_meta
          spec:
            # sdp-meta needs Python below 3.13; version 6 is 3.12.
            environment_version: "6"
            dependencies:
              - ${var.sdp_meta_dependency}

    # Does what the upload script does, inside Databricks. Downloads what
    # fetch.yml lists into the inbox. The schedule starts paused.
    fdic_fetch:
      name: ${var.catalog_prefix}fdic - fetch
      tags:
        dataset: fdic
        role: fetch
        owner: Bryan Harris
      description: Downloads what fetch.yml lists into the inbox, where the ingest job takes over.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 17 4 * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      tasks:
        - task_key: list_fetches
          # Fail once, no retries.
          disable_auto_optimization: true
          environment_key: default
          spark_python_task:
            python_file: ../../shared/list_fetches.py
            parameters:
              - --fetch_file
              - ${workspace.file_path}/datasets/fdic/fetch.yml
              - --inbox
              - /Volumes/${resources.catalogs.fdic.name}/raw/inbox
        # All of this dataset's files at once.
        - task_key: fetch_all
          depends_on:
            - task_key: list_fetches
          for_each_task:
            inputs: "{{tasks.list_fetches.values.fetches}}"
            concurrency: 4
            task:
              task_key: fetch
              # Fail once, no retries.
              disable_auto_optimization: true
              environment_key: default
              spark_python_task:
                python_file: ../../shared/fetch_url.py
                parameters:
                  - --fetch
                  - "{{input}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            # For list_fetches.py, which reads fetch.yml.
            dependencies:
              - pyyaml

  pipelines:
    fdic_pipeline:
      name: ${var.catalog_prefix}fdic - pipeline
      catalog: ${resources.catalogs.fdic.name}
      # Default schema only; each table's schema comes from conf/onboarding.yml.
      schema: ${resources.schemas.fdic_bronze.name}
      serverless: true
      tags:
        sdp_meta: ${var.sdp_meta_version}
        dataset: fdic
        role: pipeline
        owner: Bryan Harris
      libraries:
        - notebook:
            path: ../../shared/init_sdp_meta_pipeline.py
        # Current views, one per table: the latest version of each record.
        - file:
            path: tables/silver.financials.sql
        - file:
            path: tables/silver.institutions.sql
      configuration:
        layer: bronze_silver
        bronze.dataflowspecTable: ${resources.catalogs.fdic.name}.sdp_meta.bronze_dataflowspec
        bronze.group: fdic
        silver.dataflowspecTable: ${resources.catalogs.fdic.name}.sdp_meta.silver_dataflowspec
        silver.group: fdic
        sdp_meta_dependency: ${var.sdp_meta_dependency}
