# fred's Genie agent: questions in plain English about the federal funds rate.
# Written by hand. Ids are 32 hex characters, and each list is sorted by id.
# See examples/edsm/genie.yml for one built in the GUI and copied.
resources:
  genie_spaces:
    fred_genie:
      title: ${var.catalog_prefix}fred - genie
      description: Answers questions about the effective federal funds rate, by month, from FRED.
      warehouse_id: ${var.warehouse_id}
      parent_path: /Workspace/Users/${workspace.current_user.userName}
      serialized_space:
        version: 2
        config:
          sample_questions:
          - id: a0000000000000000000000000000001
            question:
            - What is the latest federal funds rate?
          - id: a0000000000000000000000000000002
            question:
            - What was the highest rate each decade?
          - id: a0000000000000000000000000000003
            question:
            - When did the rate last change by more than half a point in one month?
        data_sources:
          tables:
          - identifier: ${resources.catalogs.fred.name}.silver.fedfunds
        instructions:
          text_instructions:
          - id: b0000000000000000000000000000001
            content:
            - |
              One record per month. observation_date is the first day of the month.
              FEDFUNDS is the effective federal funds rate, in percent.
              Ignore ingest_time and source_file.
