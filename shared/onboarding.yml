# One onboarding job for every dataset. For each name in inputs, it copies
# datasets/<name>/conf to a volume, then writes sdp-meta's settings tables.
# Run after a deploy that changes any datasets/*/conf.
#
# Adding a dataset: add its name to both inputs lists.
# Free runs one task at a time, so concurrency only matters on paid workspaces.

resources:
  jobs:
    onboarding:
      name: all - onboarding
      description: Stages each dataset's conf, then writes its sdp-meta settings tables. Run after a deploy that changes datasets/*/conf.
      tasks:
        - task_key: stage_all
          for_each_task:
            inputs: '["edsm", "treasury", "documents"]'
            concurrency: 3
            task:
              task_key: stage_conf
              environment_key: sdp_meta
              python_wheel_task:
                package_name: databricks_labs_sdp_meta
                entry_point: stage_conf
                named_parameters:
                  source_conf_dir: ${workspace.file_path}/datasets/{{input}}/conf
                  uc_catalog: "{{input}}"
                  uc_schema: sdp_meta
                  conf_volume: conf
        - task_key: onboard_all
          depends_on:
            - task_key: stage_all
          for_each_task:
            inputs: '["edsm", "treasury", "documents"]'
            concurrency: 3
            task:
              task_key: onboard
              environment_key: sdp_meta
              python_wheel_task:
                package_name: databricks_labs_sdp_meta
                entry_point: run
                named_parameters:
                  onboard_layer: bronze_silver
                  database: "{{input}}.sdp_meta"
                  onboarding_file_path: /Volumes/{{input}}/sdp_meta/conf/conf/onboarding.yml
                  bronze_dataflowspec_table: bronze_dataflowspec
                  silver_dataflowspec_table: silver_dataflowspec
                  uc_enabled: "True"
                  import_author: ${workspace.current_user.userName}
                  version: v1
                  overwrite: "True"
                  # Picks the _free (or _dev) keys in onboarding.yml.
                  env: ${bundle.target}
      environments:
        - environment_key: sdp_meta
          spec:
            # Free rejects environment 1. Version 6 (latest, Sep 2026) is Python 3.12; sdp-meta needs below 3.13.
            environment_version: "6"
            dependencies:
              - ${var.sdp_meta_dependency}
