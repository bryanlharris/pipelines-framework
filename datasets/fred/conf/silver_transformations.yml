# Silver selects, one entry per silver table.
# Bronze columns are all strings; silver casts them.
# ingest_time comes from the time stamp the ingest job adds to the file
# name (YOUR_TABLE_20261104_120000.xml), so rebuilds keep the same order.
# SCD2 orders versions by it (sequence_by in onboarding.yml).

# ---- One table. Copy from here, once per table, then uncomment. ----
# - target_table: YOUR_TABLE_history
#   select_exp:
#     # CHANGE_ME → one line per column, cast from string.
#     - "cast(CHANGE_ME as double) as CHANGE_ME"
#     - "to_timestamp(regexp_extract(source_file, '_([0-9]{8}_[0-9]{6})\\.', 1), 'yyyyMMdd_HHmmss') as ingest_time"
#     - "source_file"
#
# ---- To here. ----
- target_table: fedfunds_history
  select_exp:
    - "cast(observation_date as date) as observation_date"
    # Percent: 4.33 = 4.33%.
    - "cast(FEDFUNDS as double) as FEDFUNDS"
    - "to_timestamp(regexp_extract(source_file, '_([0-9]{8}_[0-9]{6})\\.', 1), 'yyyyMMdd_HHmmss') as ingest_time"
    - "source_file"
