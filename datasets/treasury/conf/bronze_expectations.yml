# Bronze rules for treasury.
# expect_or_fail stops the pipeline: the file is broken. See doc/procedures/remove_bad_file.md.
# expect_or_drop removes the record; expect keeps it and counts it in the event log.

# Records from these files are dropped. One line per bad file, e.g.
# '%/powerPlay_20261107_150000.json'. '%/none' keeps the list from being empty.
# See doc/procedures/remove_bad_file.md.
expect_or_drop:
  not_a_bad_file: >-
    NOT source_file LIKE ANY (
      '%/none'
    )

expect_or_fail:
  date_is_date: "try_cast(NEW_DATE AS TIMESTAMP) IS NOT NULL"

expect:
  has_10_year_rate: "try_cast(BC_10YEAR AS DOUBLE) IS NOT NULL"
