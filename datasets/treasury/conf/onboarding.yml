# treasury settings for sdp-meta. One entry per table.
# The apply settings job turns this file into the settings tables.
# Keys end in _all: every target reads the same ones.

- data_flow_id: "1"
  data_flow_group: treasury
  source_system: treasury
  source_format: cloudFiles
  source_details:
    # Odd, but it keeps the catalog name out of this file. Apply settings
    # turns ${workspace.file_path}/conf into /Volumes/<catalog>/sdp_meta/conf/conf,
    # and the three ../ climb back to /Volumes/<catalog>/.
    source_path_all: "${workspace.file_path}/conf/../../../raw/files/yieldCurve/"
    source_metadata:
      include_autoloader_metadata_column: "True"
      autoloader_metadata_col_name: source_metadata
      select_metadata_cols:
        source_file: "_metadata.file_path"
  # Schema only. The pipeline adds its catalog.
  bronze_database_all: bronze
  bronze_table: yieldCurve
  bronze_table_comment: "Every record from every yieldCurve file, as strings. Daily par yield curve rates, one record per business day. Each file holds the whole year so far."
  # Rules for bronze records, in conf/bronze_expectations.yml.
  bronze_data_quality_expectations_json_all: "${workspace.file_path}/conf/bronze_expectations.yml"
  # sdp-meta needs this key when a rules file is set. Empty: no quarantine table.
  bronze_quarantine_table: ""
  bronze_reader_options:
    cloudFiles.format: "xml"
    cloudFiles.inferColumnTypes: "false"
    cloudFiles.rescuedDataColumn: "_rescued_data"
    rowTag: "m:properties"
    ignoreNamespace: "true"
    excludeAttribute: "true"
    encoding: "UTF-8"
  # Schema only, like bronze.
  silver_database_all: silver
  silver_table: yieldCurve_history
  silver_table_comment: "Full history of the daily yield curve (SCD2), one version per change to a day's rates."
  # Rules for this table's silver records.
  silver_data_quality_expectations_json_all: "${workspace.file_path}/conf/silver_expectations/yieldCurve.yml"
  # Skip deletes in bronze (e.g. removing a bad file's records) instead of failing.
  silver_reader_options:
    skipChangeCommits: "true"
  silver_transformation_json_all: "${workspace.file_path}/conf/silver_transformations.yml"
  silver_cdc_apply_changes:
    keys: ["NEW_DATE"]
    sequence_by: "ingest_time"
    scd_type: "2"
    # A new version starts only when a value changes, not each time the
    # same record arrives again.
    # add columns that change in every file but mean nothing, e.g. Id.
    track_history_except_column_list: ["Id", "ingest_time", "source_file"]
