# What job "edsm - fetch" downloads for edsm. One entry per file; the same
# files upload_edsm.ps1 sends. Comment an entry out to stop fetching it.
#
#   url         where to download from
#   inbox_file  where it lands; job "edsm - ingest" takes it from there
#   gunzip      optional, true unzips a .gz on the way in (default false)
#
# Free can't reach www.edsm.net, so on free these fail. Use upload_edsm.ps1 there.

- url: https://www.edsm.net/dump/powerPlay.json.gz
  inbox_file: /Volumes/edsm/raw/inbox/powerPlay.json
  gunzip: true

- url: https://www.edsm.net/dump/systemsWithCoordinates7days.json.gz
  inbox_file: /Volumes/edsm/raw/inbox/systemsWithCoordinates7days.json
  gunzip: true

- url: https://www.edsm.net/dump/systemsWithoutCoordinates.json.gz
  inbox_file: /Volumes/edsm/raw/inbox/systemsWithoutCoordinates.json
  gunzip: true
