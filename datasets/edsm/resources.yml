# edsm: Elite Dangerous Star Map nightly dumps (www.edsm.net): star systems and Powerplay control.
#
# The whole dataset: catalog, schemas, volumes, jobs and pipeline.
# Per table, only the router's --names list below changes.

# Enterprise catalogs live in each target's bucket, under catalogs/.
# Free has no bucket; its catalogs use default storage.
targets:
  dev:
    resources:
      catalogs:
        edsm:
          storage_root: s3://${var.catalog_bucket}/catalogs/${var.catalog_prefix}edsm/
  staging:
    resources:
      catalogs:
        edsm:
          storage_root: s3://${var.catalog_bucket}/catalogs/${var.catalog_prefix}edsm/
  prod:
    resources:
      catalogs:
        edsm:
          storage_root: s3://${var.catalog_bucket}/catalogs/${var.catalog_prefix}edsm/

resources:
  catalogs:
    # On free, the catalog is made by SQL first, then bound. On enterprise,
    # the bundle creates it. See doc/procedures/build_many_table_dataset/add_dataset.md.
    edsm:
      name: ${var.catalog_prefix}edsm
      comment: |-
        Elite Dangerous Star Map (EDSM) nightly dumps: star systems and their coordinates, and which systems each Power controls in Powerplay.

        Players' game clients report what they see, and EDSM collects it into one public map of the galaxy.

        Good for tracking how Powerplay control and the known map change over time.

        - **Owner:** Bryan Harris
        - **About:** https://www.edsm.net/en/nightly-dumps
        - **Format:** JSON, one system per line. EDSM serves it gzipped; the fetch job and upload script unzip it on the way in.
        - **Arrives:** nightly, by the fetch job or the upload script
      # The workspace sets this itself; listing it keeps the plan clean.
      properties:
        collation: UTF8_BINARY

  schemas:
    edsm_raw:
      catalog_name: ${resources.catalogs.edsm.name}
      name: raw
      comment: Files as they arrive. inbox is the drop zone. files is the permanent record.
    edsm_bronze:
      catalog_name: ${resources.catalogs.edsm.name}
      name: bronze
      comment: One table per file type. Every record from every file, as strings.
    edsm_silver:
      catalog_name: ${resources.catalogs.edsm.name}
      name: silver
      comment: Typed tables, plus views of the current records.
    edsm_gold:
      catalog_name: ${resources.catalogs.edsm.name}
      name: gold
      comment: Our own SQL tables, built from silver and from each other, inside the pipeline (tables/*.sql).
    edsm_sdp_meta:
      catalog_name: ${resources.catalogs.edsm.name}
      name: sdp_meta
      comment: The settings tables, and the copy of conf/ they are made from.

  volumes:
    edsm_raw_inbox:
      catalog_name: ${resources.catalogs.edsm.name}
      schema_name: ${resources.schemas.edsm_raw.name}
      name: inbox
      volume_type: MANAGED
      comment: Drop zone. The router moves each file to files, or to inbox/bad_files. Deletes are fine here.
    edsm_raw_files:
      catalog_name: ${resources.catalogs.edsm.name}
      schema_name: ${resources.schemas.edsm_raw.name}
      name: files
      volume_type: MANAGED
      comment: Permanent record. Only the router writes here. Nothing is ever deleted. Full rebuilds read from here.
    edsm_sdp_meta_conf:
      catalog_name: ${resources.catalogs.edsm.name}
      schema_name: ${resources.schemas.edsm_sdp_meta.name}
      name: conf
      volume_type: MANAGED
      comment: Copy of edsm/conf, made when you apply settings. Serverless can't read workspace files.

  jobs:
    edsm_ingest:
      name: edsm - ingest
      tags:
        dataset: edsm
        role: ingest
        owner: Bryan Harris
      description: Moves new files from inbox to files.
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${resources.catalogs.edsm.name}/raw/inbox/
      tasks:
        - task_key: router
          # Fail once, no retries.
          disable_auto_optimization: true
          environment_key: default
          spark_python_task:
            python_file: ../../shared/file_router.py
            parameters:
              - --catalog
              - ${resources.catalogs.edsm.name}
              - --names
              # One line per table. The router sends each file to the
              # table its name starts with. Copy for each table.
              # - YOUR_TABLE
              - powerPlay
              - systemsWithCoordinates7days
              - systemsWithoutCoordinates
              - bodies7days
        # Skip the pipeline when the router moved nothing (e.g. only a bad file).
        - task_key: any_moved
          depends_on:
            - task_key: router
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.router.values.moved}}"
            right: "0"
        - task_key: pipeline
          # No disable_auto_optimization: pipeline tasks drop it, so the plan never settles.
          depends_on:
            - task_key: any_moved
              outcome: "true"
          pipeline_task:
            pipeline_id: ${resources.pipelines.edsm_pipeline.id}
        - task_key: views
          # Fail once, no retries.
          disable_auto_optimization: true
          depends_on:
            - task_key: pipeline
          environment_key: default
          spark_python_task:
            python_file: ../../shared/create_views.py
            parameters:
              - --catalog
              - ${resources.catalogs.edsm.name}
              - --folder
              - ${workspace.file_path}/datasets/edsm/views
      environments:
        - environment_key: default
          spec:
            environment_version: "6"

    edsm_apply_settings:
      name: edsm - apply settings
      tags:
        dataset: edsm
        role: apply_settings
        owner: Bryan Harris
      description: Copies edsm/conf to a volume, then writes sdp-meta's settings tables. Run after each change to conf/.
      tasks:
        - task_key: stage_conf
          # Fail once, no retries.
          disable_auto_optimization: true
          environment_key: sdp_meta
          python_wheel_task:
            package_name: databricks_labs_sdp_meta
            entry_point: stage_conf
            named_parameters:
              source_conf_dir: ${workspace.file_path}/datasets/edsm/conf
              uc_catalog: ${resources.catalogs.edsm.name}
              uc_schema: ${resources.schemas.edsm_sdp_meta.name}
              conf_volume: ${resources.volumes.edsm_sdp_meta_conf.name}
        - task_key: apply
          # Fail once, no retries.
          disable_auto_optimization: true
          depends_on:
            - task_key: stage_conf
          environment_key: sdp_meta
          python_wheel_task:
            package_name: databricks_labs_sdp_meta
            entry_point: run
            named_parameters:
              onboard_layer: bronze_silver
              database: ${resources.catalogs.edsm.name}.${resources.schemas.edsm_sdp_meta.name}
              onboarding_file_path: /Volumes/${resources.catalogs.edsm.name}/sdp_meta/conf/conf/onboarding.yml
              bronze_dataflowspec_table: bronze_dataflowspec
              silver_dataflowspec_table: silver_dataflowspec
              uc_enabled: "True"
              import_author: ${workspace.current_user.userName}
              version: v1
              overwrite: "True"
              # Every target reads the same _all keys in onboarding.yml.
              env: all
      environments:
        - environment_key: sdp_meta
          spec:
            # sdp-meta needs Python below 3.13; version 6 is 3.12.
            environment_version: "6"
            dependencies:
              - ${var.sdp_meta_dependency}

    # Does what the upload script does, inside Databricks. Downloads what
    # fetch.yml lists into the inbox. The schedule starts paused.
    edsm_fetch:
      name: edsm - fetch
      tags:
        dataset: edsm
        role: fetch
        owner: Bryan Harris
      description: Downloads what fetch.yml lists into the inbox, where the ingest job takes over.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 17 4 * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      tasks:
        - task_key: list_fetches
          # Fail once, no retries.
          disable_auto_optimization: true
          environment_key: default
          spark_python_task:
            python_file: ../../shared/list_fetches.py
            parameters:
              - --fetch_file
              - ${workspace.file_path}/datasets/edsm/fetch.yml
              - --inbox
              - /Volumes/${resources.catalogs.edsm.name}/raw/inbox
        # All of this dataset's files at once.
        - task_key: fetch_all
          depends_on:
            - task_key: list_fetches
          for_each_task:
            inputs: "{{tasks.list_fetches.values.fetches}}"
            concurrency: 4
            task:
              task_key: fetch
              # Fail once, no retries.
              disable_auto_optimization: true
              environment_key: default
              spark_python_task:
                python_file: ../../shared/fetch_url.py
                parameters:
                  - --fetch
                  - "{{input}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            # For list_fetches.py, which reads fetch.yml.
            dependencies:
              - pyyaml

  pipelines:
    edsm_pipeline:
      name: edsm - pipeline
      catalog: ${resources.catalogs.edsm.name}
      # Default schema only; each table's schema comes from conf/onboarding.yml.
      schema: ${resources.schemas.edsm_bronze.name}
      serverless: true
      tags:
        sdp_meta: ${var.sdp_meta_version}
        dataset: edsm
        role: pipeline
        owner: Bryan Harris
      libraries:
        - notebook:
            path: ../../shared/init_sdp_meta_pipeline.py
        # Gold: our own SQL tables. The pipeline orders them by what each reads.
        - file:
            path: tables/gold.systems_with_power.sql
        - file:
            path: tables/gold.bodies_with_system.sql
        - file:
            path: tables/gold.power_summary.sql
        - file:
            path: tables/gold.power_rank.sql
        - file:
            path: tables/gold.power_bodies.sql
        - file:
            path: tables/gold.power_scoreboard.sql
        # The same tables in silver, to show SQL tables work in any schema.
        - file:
            path: tables/silver.systems_with_power.sql
        - file:
            path: tables/silver.bodies_with_system.sql
        - file:
            path: tables/silver.power_summary.sql
        - file:
            path: tables/silver.power_rank.sql
        - file:
            path: tables/silver.power_bodies.sql
        - file:
            path: tables/silver.power_scoreboard.sql
      configuration:
        layer: bronze_silver
        bronze.dataflowspecTable: ${resources.catalogs.edsm.name}.sdp_meta.bronze_dataflowspec
        bronze.group: edsm
        silver.dataflowspecTable: ${resources.catalogs.edsm.name}.sdp_meta.silver_dataflowspec
        silver.group: edsm
        sdp_meta_dependency: ${var.sdp_meta_dependency}
