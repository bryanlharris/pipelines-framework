# edsm: Elite Dangerous Star Map dumps, from raw files to silver.
#
# Flow: upload to raw.inbox -> job "edsm - ingest" (router -> pipeline -> views).
# Config changes (datasets/edsm/conf/) need job "edsm - onboarding" run once after deploy.

resources:
  catalogs:
    # Free can't create catalogs through the API (Default Storage), so on free
    # it is made once by SQL CREATE CATALOG, then bound:
    #   databricks bundle deployment bind edsm edsm -t free
    edsm:
      name: edsm
      comment: EDSM (Elite Dangerous Star Map) dumps. raw holds the files, bronze and silver the tables.
      # The workspace sets this itself; listing it keeps the plan clean.
      properties:
        collation: UTF8_BINARY

  schemas:
    edsm_raw:
      catalog_name: ${resources.catalogs.edsm.name}
      name: raw
      comment: Files as they arrive. inbox is the drop zone; files is the permanent record.
    edsm_bronze:
      catalog_name: ${resources.catalogs.edsm.name}
      name: bronze
      comment: One table per file type. Every record from every file, as strings.
    edsm_silver:
      catalog_name: ${resources.catalogs.edsm.name}
      name: silver
      comment: Typed tables with full history (SCD2), plus views of the current records.
    edsm_sdp_meta:
      catalog_name: ${resources.catalogs.edsm.name}
      name: sdp_meta
      comment: sdp-meta's settings tables (dataflowspecs) and the staged conf files.

  volumes:
    edsm_raw_inbox:
      catalog_name: ${resources.catalogs.edsm.name}
      schema_name: ${resources.schemas.edsm_raw.name}
      name: inbox
      volume_type: MANAGED
      comment: Drop zone. The router moves each file to files, or to inbox/bad_files. Deletes are fine here.
    edsm_raw_files:
      catalog_name: ${resources.catalogs.edsm.name}
      schema_name: ${resources.schemas.edsm_raw.name}
      name: files
      volume_type: MANAGED
      comment: Permanent record. Only the router writes here; nothing is ever deleted. Full rebuilds read from here.
    edsm_sdp_meta_conf:
      catalog_name: ${resources.catalogs.edsm.name}
      schema_name: ${resources.schemas.edsm_sdp_meta.name}
      name: conf
      volume_type: MANAGED
      comment: Copy of edsm/conf, made by the onboarding job. Serverless can't read workspace files.

  pipelines:
    edsm_pipeline:
      name: edsm - pipeline
      catalog: ${resources.catalogs.edsm.name}
      # Default schema only; each table's full name comes from datasets/edsm/conf/onboarding.yml.
      schema: ${resources.schemas.edsm_bronze.name}
      serverless: true
      tags:
        sdp_meta: ${var.sdp_meta_version}
      libraries:
        - notebook:
            path: ../../shared/init_sdp_meta_pipeline.py
      configuration:
        layer: bronze_silver
        bronze.dataflowspecTable: edsm.sdp_meta.bronze_dataflowspec
        bronze.group: edsm
        silver.dataflowspecTable: edsm.sdp_meta.silver_dataflowspec
        silver.group: edsm
        sdp_meta_dependency: ${var.sdp_meta_dependency}

  jobs:
    edsm_ingest:
      name: edsm - ingest
      description: Moves new files from inbox to files, then loads bronze and silver.
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/edsm/raw/inbox/
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: router
          environment_key: default
          spark_python_task:
            python_file: ../../shared/file_router.py
            parameters:
              - --catalog
              - ${resources.catalogs.edsm.name}
              - --names
              - powerPlay,systemsWithCoordinates7days,systemsWithoutCoordinates
        # Skip the pipeline when the router moved nothing (e.g. the run
        # started by a file landing in inbox/bad_files).
        - task_key: any_moved
          depends_on:
            - task_key: router
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.router.values.moved}}"
            right: "0"
        - task_key: pipeline
          depends_on:
            - task_key: any_moved
              outcome: "true"
          pipeline_task:
            pipeline_id: ${resources.pipelines.edsm_pipeline.id}
        - task_key: views
          depends_on:
            - task_key: pipeline
          environment_key: default
          spark_python_task:
            python_file: ../../shared/create_views.py
            parameters:
              - --folder
              - ${workspace.file_path}/datasets/edsm/views
      environments:
        - environment_key: default
          spec:
            environment_version: "3"

    edsm_onboarding:
      name: edsm - onboarding
      description: Copies edsm/conf to a volume, then writes sdp-meta's settings tables. Run after a deploy that changes edsm/conf.
      tasks:
        - task_key: stage_conf
          environment_key: sdp_meta
          python_wheel_task:
            package_name: databricks_labs_sdp_meta
            entry_point: stage_conf
            named_parameters:
              source_conf_dir: ${workspace.file_path}/datasets/edsm/conf
              uc_catalog: ${resources.catalogs.edsm.name}
              uc_schema: ${resources.schemas.edsm_sdp_meta.name}
              conf_volume: ${resources.volumes.edsm_sdp_meta_conf.name}
        - task_key: onboard
          depends_on:
            - task_key: stage_conf
          environment_key: sdp_meta
          python_wheel_task:
            package_name: databricks_labs_sdp_meta
            entry_point: run
            named_parameters:
              onboard_layer: bronze_silver
              database: edsm.sdp_meta
              onboarding_file_path: /Volumes/edsm/sdp_meta/conf/conf/onboarding.yml
              bronze_dataflowspec_table: bronze_dataflowspec
              silver_dataflowspec_table: silver_dataflowspec
              uc_enabled: "True"
              import_author: ${workspace.current_user.userName}
              version: v1
              overwrite: "True"
              # Picks the _free (or _dev) keys in onboarding.yml.
              env: ${bundle.target}
      environments:
        - environment_key: sdp_meta
          spec:
            # Free rejects environment 1. Version 3 is Python 3.12; sdp-meta needs below 3.13.
            environment_version: "3"
            dependencies:
              - ${var.sdp_meta_dependency}
