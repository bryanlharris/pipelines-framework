# edsm flows for sdp-meta. One entry per file type.
# Each entry makes one bronze table and one silver history table (SCD2).
#
# Paths: the onboarding job copies this folder to /Volumes/edsm/sdp_meta/conf/conf/
# and swaps the text ${workspace.file_path}/conf for that path. So
# "${workspace.file_path}/conf/x.yml" below means datasets/edsm/conf/x.yml.
#
# Keys ending in _free are for the free target; dev will need _dev keys.

- data_flow_id: "1"
  data_flow_group: edsm
  source_system: edsm
  source_format: cloudFiles
  source_details:
    source_path_free: "/Volumes/edsm/raw/files/powerPlay/"
    source_metadata:
      include_autoloader_metadata_column: "True"
      autoloader_metadata_col_name: source_metadata
      select_metadata_cols:
        source_file: "_metadata.file_path"
  bronze_database_free: "edsm.bronze"
  bronze_table: powerPlay
  bronze_table_comment: "Every record from every powerPlay dump file, as strings. Which systems each Power controls or exploits."
  bronze_reader_options:
    cloudFiles.format: "json"
    cloudFiles.inferColumnTypes: "false"
    cloudFiles.rescuedDataColumn: "_rescued_data"
    multiLine: "false"
  bronze_table_path_free: ""
  bronze_partition_columns: ""
  bronze_data_quality_expectations_json_free: "${workspace.file_path}/conf/bronze_expectations.yml"
  bronze_quarantine_table: ""  # none; sdp-meta needs the key when a rules file is set
  silver_database_free: "edsm.silver"
  silver_table: powerPlay_history
  silver_table_comment: "Full history of powerPlay (SCD2), one version per change. View silver.powerPlay shows only current records."
  # Skip deletes in bronze (e.g. removing a bad file's records) instead of failing.
  silver_reader_options:
    skipChangeCommits: "true"
  silver_table_path_free: ""
  silver_partition_columns: ""
  silver_transformation_json_free: "${workspace.file_path}/conf/silver_transformations.yml"
  silver_cdc_apply_changes:
    keys: ["id", "power"]
    sequence_by: "ingest_time"
    scd_type: "2"
    # A new version starts only when one of these changes.
    track_history_column_list: ["allegiance", "government", "powerState", "state"]

- data_flow_id: "2"
  data_flow_group: edsm
  source_system: edsm
  source_format: cloudFiles
  source_details:
    source_path_free: "/Volumes/edsm/raw/files/systemsWithCoordinates7days/"
    source_metadata:
      include_autoloader_metadata_column: "True"
      autoloader_metadata_col_name: source_metadata
      select_metadata_cols:
        source_file: "_metadata.file_path"
  bronze_database_free: "edsm.bronze"
  bronze_table: systemsWithCoordinates7days
  bronze_table_comment: "Every record from every systemsWithCoordinates7days dump file, as strings. Star systems updated in the last 7 days."
  bronze_reader_options:
    cloudFiles.format: "json"
    cloudFiles.inferColumnTypes: "false"
    cloudFiles.rescuedDataColumn: "_rescued_data"
    multiLine: "false"
  bronze_table_path_free: ""
  bronze_partition_columns: ""
  bronze_data_quality_expectations_json_free: "${workspace.file_path}/conf/bronze_expectations.yml"
  bronze_quarantine_table: ""  # none; sdp-meta needs the key when a rules file is set
  silver_database_free: "edsm.silver"
  silver_table: systems_history
  silver_table_comment: "Full history of star systems (SCD2), one version per change. View silver.systems shows only current records."
  silver_reader_options:
    skipChangeCommits: "true"
  silver_table_path_free: ""
  silver_partition_columns: ""
  silver_transformation_json_free: "${workspace.file_path}/conf/silver_transformations.yml"
  silver_cdc_apply_changes:
    keys: ["id"]
    sequence_by: "ingest_time"
    scd_type: "2"
    track_history_column_list: ["name", "coords"]
