# Silver selects, one entry per silver table.
# Bronze columns are all strings; silver casts them.
# ingest_time comes from the time stamp the router adds to the file name
# (powerPlay_20261102_120000.json), so rebuilds keep the same order.
# SCD2 orders versions by it (sequence_by in onboarding.yml).

- target_table: powerPlay_history
  select_exp:
    - "cast(id as int) as id"
    - "cast(id64 as bigint) as id64"
    - "name"
    - "power"
    - "powerState"
    - "allegiance"
    - "government"
    - "state"
    - "from_json(coords, 'STRUCT<x: DOUBLE, y: DOUBLE, z: DOUBLE>') as coords"
    - "cast(date as timestamp) as date"
    - "to_timestamp(regexp_extract(source_file, '_([0-9]{8}_[0-9]{6})\\.', 1), 'yyyyMMdd_HHmmss') as ingest_time"
    - "source_file"

- target_table: systems_history
  select_exp:
    - "cast(id as int) as id"
    - "cast(id64 as bigint) as id64"
    - "name"
    - "from_json(coords, 'STRUCT<x: DOUBLE, y: DOUBLE, z: DOUBLE>') as coords"
    - "cast(date as timestamp) as date"
    - "to_timestamp(regexp_extract(source_file, '_([0-9]{8}_[0-9]{6})\\.', 1), 'yyyyMMdd_HHmmss') as ingest_time"
    - "source_file"
