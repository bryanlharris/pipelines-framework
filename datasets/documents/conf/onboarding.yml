# documents settings for sdp-meta. One entry per table.
# The apply settings job turns this file into the settings tables.
# Keys end in _all: every target reads the same ones.

# ---- One table. Copy from here, once per table, then uncomment. ----
# - data_flow_id: "CHANGE_ME → 1 for the first table, 2 for the next, and so on"
#   data_flow_group: documents
#   source_system: documents
#   source_format: cloudFiles
#   source_details:
#     # Odd, but it keeps the catalog name out of this file. Apply settings
#     # turns ${workspace.file_path}/conf into /Volumes/<catalog>/sdp_meta/conf/conf,
#     # and the three ../ climb back to /Volumes/<catalog>/.
#     source_path_all: "${workspace.file_path}/conf/../../../raw/files/YOUR_TABLE/"
#     source_metadata:
#       include_autoloader_metadata_column: "True"
#       autoloader_metadata_col_name: source_metadata
#       select_metadata_cols:
#         source_file: "_metadata.file_path"
#   # Schema only. The pipeline adds its catalog.
#   bronze_database_all: bronze
#   bronze_table: YOUR_TABLE
#   bronze_table_comment: "CHANGE_ME → what one record is, e.g. Every record from every yieldCurve file, as strings."
#   # Rules for bronze records, in conf/bronze_expectations.yml.
#   bronze_data_quality_expectations_json_all: "${workspace.file_path}/conf/bronze_expectations.yml"
#   # sdp-meta needs this key when a rules file is set. Empty: no quarantine table.
#   bronze_quarantine_table: ""
#   bronze_reader_options:
#     cloudFiles.format: "CHANGE_ME → csv, json or xml"
#     cloudFiles.inferColumnTypes: "false"
#     cloudFiles.rescuedDataColumn: "_rescued_data"
#     # CHANGE_ME → any options your format needs, e.g. for xml: rowTag.
#     # All options: https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/options
#   # Schema only, like bronze.
#   silver_database_all: silver
#   silver_table: YOUR_TABLE_history
#   silver_table_comment: "CHANGE_ME → what one version is, e.g. Full history of the daily yield curve (SCD2), one version per change to a day's rates."
#   # Rules for this table's silver records.
#   silver_data_quality_expectations_json_all: "${workspace.file_path}/conf/silver_expectations/YOUR_TABLE.yml"
#   # Skip deletes in bronze (e.g. removing a bad file's records) instead of failing.
#   silver_reader_options:
#     skipChangeCommits: "true"
#   silver_transformation_json_all: "${workspace.file_path}/conf/silver_transformations.yml"
#   silver_cdc_apply_changes:
#     keys: ["CHANGE_ME → the column that names one record, e.g. NEW_DATE"]
#     sequence_by: "ingest_time"
#     scd_type: "2"
#     # A new version starts only when a value changes, not each time the
#     # same record arrives again.
#     # CHANGE_ME → add columns that change in every file but mean nothing, e.g. Id.
#     track_history_except_column_list: ["ingest_time", "source_file"]
#     # Or name only the columns to track, when that list is shorter.
#     # Use one key or the other, not both.
#     # track_history_column_list: ["CHANGE_ME"]
#
# ---- To here. ----
- data_flow_id: "1"
  data_flow_group: documents
  source_system: documents
  source_format: cloudFiles
  source_details:
    # Odd, but it keeps the catalog name out of this file. Apply settings
    # turns ${workspace.file_path}/conf into /Volumes/<catalog>/sdp_meta/conf/conf,
    # and the three ../ climb back to /Volumes/<catalog>/.
    source_path_all: "${workspace.file_path}/conf/../../../raw/files/documents/"
    source_metadata:
      include_autoloader_metadata_column: "True"
      autoloader_metadata_col_name: source_metadata
      select_metadata_cols:
        source_file: "_metadata.file_path"
  # Schema only. The pipeline adds its catalog.
  bronze_database_all: bronze
  bronze_table: documents
  bronze_table_comment: "One record per PDF: its path, size and bytes."
  # Rules for bronze records, in conf/bronze_expectations.yml.
  bronze_data_quality_expectations_json_all: "${workspace.file_path}/conf/bronze_expectations.yml"
  # sdp-meta needs this key when a rules file is set. Empty: no quarantine table.
  bronze_quarantine_table: ""
  bronze_reader_options:
    cloudFiles.format: "binaryFile"
    # binaryFile reads each file whole, so the column options above don't apply.
    pathGlobFilter: "*.pdf"
    # All options: https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/options
  # Schema only, like bronze.
  silver_database_all: silver
  silver_table: documents_history
  silver_table_comment: "What ai_classify found in each PDF (SCD2), one version per PDF. Holds PII: the rationales quote what was found."
  # Rules for this table's silver records.
  silver_data_quality_expectations_json_all: "${workspace.file_path}/conf/silver_expectations/documents.yml"
  # Skip deletes in bronze (e.g. removing a bad file's records) instead of failing.
  silver_reader_options:
    skipChangeCommits: "true"
  silver_transformation_json_all: "${workspace.file_path}/conf/silver_transformations.yml"
  silver_cdc_apply_changes:
    keys: ["source_file"]
    sequence_by: "ingest_time"
    scd_type: "2"
    # A new version starts only when a value changes, not each time the
    # same record arrives again.
    track_history_column_list: ["classification"]
