# documents flows for sdp-meta. One entry per file type.
# Bronze keeps each PDF whole (bytes). Silver runs the AI once per PDF:
# ai_parse_document for the text, then ai_classify for the PII labels.
# Silver is append only (no keys, no SCD2): one record per PDF file.
#
# Paths: the onboarding job copies this folder to /Volumes/documents/sdp_meta/conf/conf/
# and swaps the text ${workspace.file_path}/conf for that path. So
# "${workspace.file_path}/conf/x.yml" below means datasets/documents/conf/x.yml.
#
# Keys ending in _free are for the free target; dev will need _dev keys.

- data_flow_id: "1"
  data_flow_group: documents
  source_system: documents
  source_format: cloudFiles
  source_details:
    source_path_free: "/Volumes/documents/raw/files/pdf/"
    source_metadata:
      include_autoloader_metadata_column: "True"
      autoloader_metadata_col_name: source_metadata
      select_metadata_cols:
        source_file: "_metadata.file_path"
  bronze_database_free: "documents.bronze"
  bronze_table: pdf
  bronze_table_comment: "One record per PDF file: path, size and the file's bytes (content). Holds PII inside the bytes."
  bronze_reader_options:
    cloudFiles.format: "binaryFile"
    pathGlobFilter: "*.pdf"
  bronze_table_path_free: ""
  bronze_partition_columns: ""
  bronze_data_quality_expectations_json_free: "${workspace.file_path}/conf/bronze_expectations.yml"
  bronze_quarantine_table: ""  # none; sdp-meta needs the key when a rules file is set
  silver_database_free: "documents.silver"
  silver_table: pii_scans
  silver_table_comment: "One record per PDF: parsed text (parsed) and PII labels with confidence and rationale (classification). Holds PII values."
  silver_reader_options:
    skipChangeCommits: "true"
  silver_table_path_free: ""
  silver_partition_columns: ""
  silver_transformation_json_free: "${workspace.file_path}/conf/silver_transformations.yml"
