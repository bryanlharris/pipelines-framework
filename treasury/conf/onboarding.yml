# treasury flows for sdp-meta. One entry per file type.
# Each entry makes one bronze table and one silver history table (SCD2).
#
# Paths: the onboarding job copies this folder to /Volumes/treasury/sdp_meta/conf/conf/
# and swaps the text ${workspace.file_path}/conf for that path. So
# "${workspace.file_path}/conf/x.yml" below means treasury/conf/x.yml.
#
# Keys ending in _free are for the free target; dev will need _dev keys.

- data_flow_id: "1"
  data_flow_group: treasury
  source_system: treasury
  source_format: cloudFiles
  source_details:
    source_path_free: "/Volumes/treasury/raw/files/yieldCurve/"
    source_metadata:
      include_autoloader_metadata_column: "True"
      autoloader_metadata_col_name: source_metadata
      select_metadata_cols:
        source_file: "_metadata.file_path"
  bronze_database_free: "treasury.bronze"
  bronze_table: yieldCurve
  bronze_table_comment: "Every record from every yieldCurve file, as strings. Daily par yield curve rates, one record per business day. Each file holds the whole year so far."
  # The file is an Atom feed; each day is one <m:properties> element.
  bronze_reader_options:
    cloudFiles.format: "xml"
    cloudFiles.inferColumnTypes: "false"
    cloudFiles.rescuedDataColumn: "_rescued_data"
    rowTag: "m:properties"
    ignoreNamespace: "true"
    excludeAttribute: "true"
    encoding: "UTF-8"
  bronze_table_path_free: ""
  bronze_partition_columns: ""
  bronze_data_quality_expectations_json_free: "${workspace.file_path}/conf/bronze_expectations.yml"
  bronze_quarantine_table: ""  # none; sdp-meta needs the key when a rules file is set
  silver_database_free: "treasury.silver"
  silver_table: yieldCurve_history
  silver_table_comment: "Full history of the daily yield curve (SCD2), one version per change to a day's rates. View silver.yieldCurve shows only current records."
  # Skip deletes in bronze (e.g. removing a bad file's records) instead of failing.
  silver_reader_options:
    skipChangeCommits: "true"
  silver_table_path_free: ""
  silver_partition_columns: ""
  silver_transformation_json_free: "${workspace.file_path}/conf/silver_transformations.yml"
  silver_cdc_apply_changes:
    keys: ["NEW_DATE"]
    sequence_by: "ingest_time"
    scd_type: "2"
    # Each file repeats the whole year. A new version starts only when a rate
    # changes, not each time the same day arrives again.
    track_history_except_column_list: ["Id", "ingest_time", "source_file"]
