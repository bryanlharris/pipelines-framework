# One onboarding.yml entry, to copy. Explained in doc/onboarding.md.
#
# Replace every <...>. Lines marked CHANGE differ per table; the rest
# is the same in every entry: copy it as is.
#   <dataset>  catalog and folder name, e.g. treasury
#   <name>     file type, e.g. yieldCurve (the router's --names entry)
#   <n>        next free number in this file: "1", "2", ...

- data_flow_id: "<n>"                                         # CHANGE
  data_flow_group: <dataset>
  source_system: <dataset>
  source_format: cloudFiles
  source_details:
    source_path_free: "/Volumes/<dataset>/raw/files/<name>/"  # CHANGE
    source_metadata:
      include_autoloader_metadata_column: "True"
      autoloader_metadata_col_name: source_metadata
      select_metadata_cols:
        source_file: "_metadata.file_path"

  bronze_database_free: "<dataset>.bronze"
  bronze_table: <name>                                        # CHANGE
  bronze_table_comment: "<what one record is>"                # CHANGE
  bronze_reader_options:                                      # CHANGE (by file format)
    cloudFiles.format: "json"
    cloudFiles.inferColumnTypes: "false"
    cloudFiles.rescuedDataColumn: "_rescued_data"
  bronze_table_path_free: ""
  bronze_partition_columns: ""
  bronze_data_quality_expectations_json_free: "${workspace.file_path}/conf/bronze_expectations.yml"
  bronze_quarantine_table: ""

  silver_database_free: "<dataset>.silver"
  silver_table: <name>_history                                # CHANGE
  silver_table_comment: "<what one record is>"                # CHANGE
  silver_reader_options:
    skipChangeCommits: "true"
  silver_table_path_free: ""
  silver_partition_columns: ""
  silver_transformation_json_free: "${workspace.file_path}/conf/silver_transformations.yml"
  # SCD2 history. Delete this block for an append-only silver table.
  silver_cdc_apply_changes:                                   # CHANGE
    keys: ["<key column>"]
    sequence_by: "ingest_time"
    scd_type: "2"
    track_history_except_column_list: ["ingest_time", "source_file"]
