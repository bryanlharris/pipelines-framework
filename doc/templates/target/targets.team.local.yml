# The team targets: dev, staging and prod. Copy to targets/; git ignores it,
# so bucket names and your name stay on this computer. Uncomment the targets
# you deploy to, and change CHANGE_ME.
#
# For the treasury dataset, in a bundle named team, for Jim:
#
# - dev       dev_jim_treasury        Jim's own copy, from his branch
# - staging   staging_treasury        one copy, from a tag, by the lead
# - prod      treasury                one copy, from a tag, by the lead
#
# Each catalog keeps its data in s3://<bucket>/catalogs/<catalog>/.
targets:
#   dev:
#     # A failed pipeline update stops, no retries.
#     presets:
#       pipelines_development: true
#     workspace:
#       profile: dev
#     variables:
#       # Your first name keeps your copy apart from everyone else's.
#       catalog_prefix: dev_CHANGE_ME_   # → your first name, e.g. dev_jim_
#       catalog_bucket: CHANGE_ME → the bucket name only, e.g. foobar
#       team_group: CHANGE_ME → the team's group
#       warehouse_id: CHANGE_ME → the SQL warehouse's id
#
#   staging:
#     presets:
#       pipelines_development: true
#     workspace:
#       profile: staging
#       # One shared copy: its state lives here, not in your home folder.
#       root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
#     permissions:
#       - user_name: CHANGE_ME → the team lead's email
#         level: CAN_MANAGE
#       - group_name: ${var.team_group}
#         level: CAN_VIEW
#     variables:
#       catalog_prefix: staging_
#       # Read prod's raw.files; staging's own stay empty.
#       files_prefix: ""
#       catalog_bucket: CHANGE_ME → the bucket name only
#       team_group: CHANGE_ME → the team's group
#       warehouse_id: CHANGE_ME → the SQL warehouse's id
#
#   prod:
#     workspace:
#       profile: prod
#       root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
#     # Jobs and pipelines run as the service principal, not as whoever deployed.
#     run_as:
#       service_principal_name: ${var.run_as}
#     permissions:
#       - user_name: CHANGE_ME → the team lead's email
#         level: CAN_MANAGE
#       # The sp's ingest job starts the pipeline.
#       - service_principal_name: ${var.run_as}
#         level: CAN_RUN
#       - group_name: ${var.team_group}
#         level: CAN_VIEW
#     variables:
#       catalog_prefix: ""
#       run_as: CHANGE_ME → the sp's application id
#       catalog_bucket: CHANGE_ME → the bucket name only
#       team_group: CHANGE_ME → the team's group
#       warehouse_id: CHANGE_ME → the SQL warehouse's id
