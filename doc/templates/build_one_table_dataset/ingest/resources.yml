
  jobs:
    YOUR_DATASET_ingest:
      name: ${var.catalog_prefix}YOUR_DATASET - ingest
      description: Moves new files from inbox to files.
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${resources.catalogs.YOUR_DATASET.name}/raw/inbox/
          # Waits for the last of several files, so one run takes them all.
          # One file per upload? Delete it.
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: router
          # Fail once, no retries.
          disable_auto_optimization: true
          environment_key: default
          spark_python_task:
            python_file: ../../shared/file_router.py
            parameters:
              - --catalog
              - ${resources.catalogs.YOUR_DATASET.name}
              - --names
              - YOUR_TABLE
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
