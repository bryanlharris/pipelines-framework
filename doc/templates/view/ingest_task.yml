        - task_key: views
          # Fail once, no retries.
          disable_auto_optimization: true
          depends_on:
            - task_key: pipeline
          environment_key: default
          spark_python_task:
            python_file: ../../shared/create_views.py
            parameters:
              - --catalog
              - ${resources.catalogs.YOUR_DATASET.name}
              - --folder
              - ${workspace.file_path}/datasets/YOUR_DATASET/views
