# pipelines-framework: one bundle for your datasets. Each dataset is built with
# sdp-meta (Databricks Labs) and has its own folder: datasets/<dataset>/resources.yml,
# conf/, tables/, upload script. Shared code is in shared/. Each target has
# its own file in targets/.
# Deploy with:
#   databricks bundle deploy -t <target>
#
# No default target: every command names one with -t.
# Targets go in git-ignored files in targets/, copied from
# doc/templates/target/: targets.free.local.yml or targets.team.local.yml.

bundle:
  # Change to your team, e.g. sdp_edsm. The name sets where the bundle keeps its state.
  name: YOUR_TEAM

include:
  - targets/*.yml
  # One level only; ** does not recurse.
  - "datasets/*/resources.yml"
  - "datasets/*/genie.yml"

sync:
  exclude:
    - tools/

variables:
  catalog_prefix:
    description: Put before every catalog name, e.g. dev_. Set by each target; empty on free and prod.
    default: ""
  files_prefix:
    description: The prefix of the catalog whose raw.files the pipelines read. Same as catalog_prefix, except on staging, which sets "" to read prod's files.
    default: ${var.catalog_prefix}
  run_as:
    description: Who runs the jobs and pipelines, and gets ALL_PRIVILEGES on each catalog. The deployer, except on prod, which sets the sp's application id.
    default: ${workspace.current_user.userName}
  team_group:
    description: The team's group. Reads every table. Set by dev, staging and prod; free uses account users.
    default: account users
  catalog_bucket:
    description: The S3 bucket that holds this target's catalogs, under catalogs/. Set by dev, staging and prod; free has none.
    default: ""
  warehouse_id:
    description: The SQL warehouse that runs each Genie agent's queries. Set by each target that has a datasets/*/genie.yml.
    default: ""
  sdp_meta_dependency:
    description: The sdp-meta package. Installed by the onboarding job and by the pipeline's runner notebook.
    default: databricks-labs-sdp-meta==0.1.0
  sdp_meta_version:
    description: Tag on every pipeline, so the sdp-meta app and tag search find them.
    default: "0.1.0"
