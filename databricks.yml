# sdp-framework: one bundle for your datasets. Each dataset is built with
# sdp-meta (Databricks Labs) and has its own folder: datasets/<dataset>/resources.yml,
# conf/, tables/, upload script. Shared code is in shared/. Each target has
# its own file in targets/.
# Deploy with:
#   databricks bundle deploy -t <target>
#
# No default target: every command names one with -t.
# Targets go in a git-ignored targets/targets.local.yml, copied from
# doc/templates/target/targets.local.yml.

bundle:
  # Change to your team, e.g. sdp_edsm. The name sets where the bundle keeps its state.
  name: YOUR_TEAM

include:
  - targets/*.yml
  # One level only; ** does not recurse.
  - "datasets/*/resources.yml"

sync:
  exclude:
    - tools/

variables:
  catalog_prefix:
    description: Put before every catalog name, e.g. dev_. Set by each target; empty on free and prod.
    default: ""
  catalog_bucket:
    description: The S3 bucket that holds this target's catalogs, under catalogs/. Set by dev, staging and prod; free has none.
    default: ""
  sdp_meta_dependency:
    description: The sdp-meta package. Installed by the onboarding job and by the pipeline's runner notebook.
    default: databricks-labs-sdp-meta==0.1.0
  sdp_meta_version:
    description: Tag on every pipeline, so the sdp-meta app and tag search find them.
    default: "0.1.0"
